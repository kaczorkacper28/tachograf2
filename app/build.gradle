plugins { id 'com.android.application' }

android { namespace 'pl.tachograf2'; compileSdk 35
    defaultConfig { applicationId 'pl.tachograf2'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0' }
}

// Ujednolicamy biblioteki Kotlin, żeby uniknąć konfliktu stdlib 1.8.x z jdk7/jdk8 1.6.x.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
